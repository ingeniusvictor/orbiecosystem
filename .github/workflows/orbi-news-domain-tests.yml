name: ORBI News Domain Tests

on:
  push:
    branches:
      - feature/orbi-news-agent
    paths:
      - 'domain/**'
      - 'server/**'
      - 'api/**'
      - 'server.ts'
      - 'orbi-news-runtime.ts'
      - 'vercel.json'
      - 'src/news/**'
      - 'src/editorial/**'
      - 'src/App.tsx'
      - 'src/seoMetadata.ts'
      - 'tests/deterministic/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/orbi-news-domain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Run ORBI News deterministic tests
        run: npm run test:orbi-news

      - name: Production build validation
        run: npm run build
