name: ORBI News ECC AgentShield report-only

on:
  workflow_dispatch:
  pull_request:
    branches:
      - staging/orbi-news-vercel
    paths:
      - ".github/workflows/orbi-news-ecc-agentshield-report.yml"
      - ".orbi/**"
      - ".agents/**"
      - "docs/ecc/**"
      - "AGENTS.md"
      - "domain/operations/**"
      - "domain/verification/**"
      - "domain/editorial/**"
      - "domain/publications/**"
      - "server/operations/**"
      - "server/editorial/**"
      - "server/news/**"
      - "api/**"
      - "server.ts"
      - "orbi-news-runtime.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: orbi-news-ecc-agentshield-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  report-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: AgentShield scan
        id: agentshield
        continue-on-error: true
        uses: affaan-m/agentshield@b0891303bdcd6037376a94263d45cfd2ff3dfb98 # ecc-agentshield v1.6.0
        with:
          path: "."
          min-severity: "low"
          fail-on-findings: false
          format: "sarif"
          sarif-output: "agentshield-results.sarif"
          save-baseline: ".agentshield/current-baseline.json"
          supply-chain: true
          supply-chain-online: false
          fail-on-supply-chain: false
          evidence-pack: ".agentshield/evidence"
          verify-evidence-pack: true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ORBI News ECC AgentShield — report only"
            echo
            echo "- Scanner outcome: ${{ steps.agentshield.outcome }}"
            echo "- Security score: ${{ steps.agentshield.outputs.score }}"
            echo "- Grade: ${{ steps.agentshield.outputs.grade }}"
            echo "- Total findings: ${{ steps.agentshield.outputs.total-findings }}"
            echo "- Critical findings: ${{ steps.agentshield.outputs.critical-count }}"
            echo "- Supply-chain status: ${{ steps.agentshield.outputs.supply-chain-status }}"
            echo
            echo "**Report-only. No automatic fixes. No inherited exceptions.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbi-news-ecc-agentshield-${{ github.run_id }}
          path: |
            agentshield-results.sarif
            .agentshield/evidence
            .agentshield/current-baseline.json
          if-no-files-found: warn
          retention-days: 14
