name: ORBI News ECC Pull Request Gate

on:
  pull_request:
    branches:
      - staging/orbi-news-vercel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbi-news-ecc-pr-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: ORBI News deterministic tests
        run: npm run test:orbi-news

      - name: Production build
        run: npm run build
