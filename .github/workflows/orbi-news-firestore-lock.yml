name: ORBI News Firestore Lock Generator

on:
  push:
    branches:
      - feature/orbi-news-agent
    paths:
      - '.github/workflows/orbi-news-firestore-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Resolve official Firestore SDK lock
        run: npm install --package-lock-only --save-exact @google-cloud/firestore@9.0.0

      - name: Verify resolved dependency
        run: node -e "const p=require('./package.json'); if(p.dependencies?.['@google-cloud/firestore']!=='9.0.0') process.exit(1)"

      - name: Commit reproducible manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No manifest changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(na-08): install Firestore server SDK"
          git push origin HEAD:feature/orbi-news-agent

      - name: Upload reproducible manifests
        uses: actions/upload-artifact@v4
        with:
          name: orbi-firestore-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
